name: Build matrix (compile compatibility)

# Tier 1 CI: verifies every module still COMPILES against multiple kernel
# versions. This does not insmod/boot anything - GitHub-hosted runners
# can't switch their host kernel, and free-tier runners have unreliable
# /dev/kvm access, so this is compile-only compatibility testing.
# Runtime testing (insmod + trigger detection) belongs in a separate
# QEMU-based job - see README.md "CI" section for why that's kept apart.

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Auto-updated weekly by .github/workflows/update-kernel-matrix.yml
        # (see .github/scripts/update-kernel-matrix.sh) - edits between the
        # BEGIN/END markers get overwritten by that job, so hand-edit
        # outside the markers if you need to add e.g. a one-off version.
        kernel_version:
          # BEGIN kernel_version
          - "6.12.96"  # LTS
          - "6.18.21"  # LTS
          - "7.1.4"  # current stable
          # END kernel_version
        # A module generally must be built with the same compiler family
        # as the target kernel, especially under LTO/CFI configs - e.g.
        # CachyOS ships a Clang-built kernel variant. Rather than branch
        # the repo per toolchain, we build BOTH the kernel and the module
        # with the same compiler on each leg of this matrix.
        toolchain: [gcc, clang]
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies (gcc)
        if: matrix.toolchain == 'gcc'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev

      - name: Install build dependencies (clang)
        if: matrix.toolchain == 'clang'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm bc bison flex libssl-dev libelf-dev

      - name: Cache built kernel tree
        id: cache-kernel
        uses: actions/cache@v6
        with:
          path: linux-${{ matrix.kernel_version }}-${{ matrix.toolchain }}
          # v6: bumped from v5 because caches built under v5 are the
          # broken 32-bit (CONFIG_X86_32) trees this commit fixes -
          # without a key bump, cache hits would keep serving them and
          # silently skip the corrected build step below forever.
          key: kernel-tree-v6-${{ matrix.kernel_version }}-${{ matrix.toolchain }}

      - name: Download and build a minimal kernel
        if: steps.cache-kernel.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          MAJOR="$(echo "${{ matrix.kernel_version }}" | cut -d. -f1)"
          SRCDIR="linux-${{ matrix.kernel_version }}-${{ matrix.toolchain }}"
          curl -fL -o linux.tar.xz \
            "https://cdn.kernel.org/pub/linux/kernel/v${MAJOR}.x/linux-${{ matrix.kernel_version }}.tar.xz"
          mkdir -p "$SRCDIR"
          tar -xf linux.tar.xz -C "$SRCDIR" --strip-components=1
          rm linux.tar.xz
          cd "$SRCDIR"
          LLVM_ARG=""
          if [ "${{ matrix.toolchain }}" = "clang" ]; then LLVM_ARG="LLVM=1"; fi
          # modules_prepare alone does NOT produce a real Module.symvers -
          # that file is only populated by actually compiling the kernel
          # source that contains EXPORT_SYMBOL() calls. A full defconfig
          # build works but takes 30-60+ minutes; tinyconfig + just the
          # subsystems our modules touch gets a real, complete symbol
          # table in a few minutes instead.
          make $LLVM_ARG tinyconfig
          # tinyconfig is allnoconfig-based, and CONFIG_64BIT's Kconfig
          # default doesn't survive that on x86 - it silently comes out
          # as a 32-bit (CONFIG_X86_32) build otherwise. On 32-bit,
          # struct pt_regs has no r8-r15 fields at all, so every module
          # here that reads real_regs->r8/r10/etc (execveat/openat/
          # rename's raw-syscall-register hooks) fails to compile with
          # "no member named 'rN' in 'struct pt_regs'" - not a real
          # compatibility break, just this matrix quietly building the
          # wrong word size. Force it explicitly rather than relying on
          # tinyconfig's default.
          ./scripts/config --enable CONFIG_64BIT
          ./scripts/config --enable CONFIG_MODULES
          ./scripts/config --enable CONFIG_KPROBES
          ./scripts/config --enable CONFIG_CRYPTO
          ./scripts/config --enable CONFIG_CRYPTO_HASH
          ./scripts/config --enable CONFIG_CRYPTO_MD5
          ./scripts/config --enable CONFIG_CRYPTO_SHA1
          ./scripts/config --enable CONFIG_CRYPTO_SHA256
          ./scripts/config --enable CONFIG_PROC_FS
          ./scripts/config --enable CONFIG_NET
          make $LLVM_ARG olddefconfig
          make $LLVM_ARG -j"$(nproc)"

      - name: Build av/ against this kernel tree
        run: |
          set -euxo pipefail
          KDIR="$GITHUB_WORKSPACE/linux-${{ matrix.kernel_version }}-${{ matrix.toolchain }}"
          if [ "${{ matrix.toolchain }}" = "clang" ]; then
            make -C av KDIR="$KDIR" CC=clang LLVM=1 clean
            make -C av KDIR="$KDIR" CC=clang LLVM=1
          else
            make -C av KDIR="$KDIR" clean
            make -C av KDIR="$KDIR"
          fi

      - name: Verify netlink_chan.o actually linked into av.ko
        run: |
          set -euxo pipefail
          # A compile-only leg is only meaningful if every source file
          # that's SUPPOSED to be in av.ko actually got compiled and
          # linked in. genl_register_family()/genlmsg_*() (used by
          # netlink_chan.c) don't sit behind a separate Kconfig symbol
          # on current kernels - net/netlink/ (genetlink.c included) is
          # unconditionally obj-y under net/Makefile, gated only by the
          # CONFIG_NET this workflow already enables, and there is no
          # "CONFIG_GENERIC_NETLINK" symbol in mainline to check for
          # (confirmed by grepping every Kconfig* in torvalds/linux -
          # it doesn't exist as a selectable option). So instead of
          # checking a config bit that isn't real, check the actual
          # thing that matters: that av_netlink_init() - a non-static
          # function only defined in netlink_chan.c - shows up in the
          # built module's symbol table. If a future kernel version
          # ever *does* gate genetlink behind something this workflow
          # doesn't enable, netlink_chan.c would fail to compile
          # (missing genl_register_family() etc.) long before this
          # step, and if it's silently excluded some other way, this
          # is what catches it instead of a green compile-only build
          # giving false confidence.
          nm av/av.ko | grep -q ' T av_netlink_init$' || \
            (echo "::error::av_netlink_init not found in av.ko - netlink_chan.o did not link in" && exit 1)

      - name: Build experiments/ against this kernel tree
        run: |
          set -euxo pipefail
          KDIR="$GITHUB_WORKSPACE/linux-${{ matrix.kernel_version }}-${{ matrix.toolchain }}"
          EXTRA_ARGS=""
          if [ "${{ matrix.toolchain }}" = "clang" ]; then EXTRA_ARGS="CC=clang LLVM=1"; fi
          for d in experiments/hello experiments/procfs_demo experiments/kprobe_log; do
            echo "::group::Building $d"
            make -C "$d" KDIR="$KDIR" $EXTRA_ARGS clean
            make -C "$d" KDIR="$KDIR" $EXTRA_ARGS
            echo "::endgroup::"
          done

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: modules-${{ matrix.kernel_version }}-${{ matrix.toolchain }}
          path: |
            av/*.ko
            experiments/*/*.ko
          if-no-files-found: warn

  build-avctl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build avctl
        run: make -C userspace/avctl
      - uses: actions/upload-artifact@v7
        with:
          name: avctl
          path: userspace/avctl/avctl
          if-no-files-found: error

  build-avd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install libnl-genl, libyara, libfuzzy, and libtlsh
        run: |
          sudo apt-get update
          sudo apt-get install -y libnl-genl-3-dev libyara-dev libfuzzy-dev libtlsh-dev pkg-config
      - name: Build avd
        run: make -C userspace/avd

      - name: Smoke-test YARA rules against EICAR
        run: |
          set -euxo pipefail
          sudo apt-get install -y yara
          printf 'X5O!P%%@AP[4\PZX54(P^)7CC)7}$EICAR-STANDARD-ANTIVIRUS-TEST-FILE!$H+H*' > /tmp/eicar.com
          yara rules/test.yar /tmp/eicar.com | grep -q EICAR_Test_String

      - name: Smoke-test heuristics.yar against a real ptrace-importing binary
        run: |
          set -euxo pipefail
          cat > /tmp/ptrace_test.c << 'EOF'
          #include <sys/ptrace.h>
          #include <stddef.h>
          int main(void) { ptrace(PTRACE_ATTACH, 1234, NULL, NULL); return 0; }
          EOF
          gcc -o /tmp/ptrace_test /tmp/ptrace_test.c
          yara rules/heuristics.yar /tmp/ptrace_test | grep -q Imports_Ptrace
          # a genuinely clean binary should NOT match
          ! yara rules/heuristics.yar /bin/ls | grep -q Imports_Ptrace

      - name: Smoke-test elf_analysis.yar against a real UPX-packed binary
        run: |
          set -euxo pipefail
          sudo apt-get install -y upx-ucl
          upx --best -o /tmp/upx_packed /tmp/ptrace_test
          yara rules/elf_analysis.yar /tmp/upx_packed | grep -q No_Section_Headers
          ! yara rules/elf_analysis.yar /bin/ls | grep -q No_Section_Headers

      - name: Smoke-test entropy.yar against real calibration samples
        run: |
          set -euxo pipefail
          head -c 100000 /dev/urandom > /tmp/random_sample.bin
          yara rules/entropy.yar /tmp/upx_packed | grep -q High_Overall_Entropy
          yara rules/entropy.yar /tmp/random_sample.bin | grep -q High_Overall_Entropy
          ! yara rules/entropy.yar /bin/ls | grep -q High_Overall_Entropy
          # per-section check: inject a real high-entropy section and confirm it fires
          cp /tmp/ptrace_test /tmp/section_entropy_test
          objcopy --add-section .packed_data=/tmp/random_sample.bin \
                  --set-section-flags .packed_data=alloc,contents \
                  /tmp/section_entropy_test
          yara rules/entropy.yar /tmp/section_entropy_test | grep -q High_Entropy_Section

      - name: Smoke-test fuzzy hash corpus matching
        run: |
          set -euxo pipefail
          sudo apt-get install -y ssdeep
          # a minor variant (a few bytes appended) should score high
          # similarity against the corpus-seed original - this is the
          # whole point of fuzzy hashing vs exact hash matching
          cp /tmp/ptrace_test /tmp/ptrace_test_variant
          echo "extra padding for testing" >> /tmp/ptrace_test_variant
          ssdeep -b /tmp/ptrace_test > /tmp/corpus_hash.txt
          ssdeep -m /tmp/corpus_hash.txt /tmp/ptrace_test_variant | grep -q "matches"
          # an unrelated file should NOT match
          ! ssdeep -m /tmp/corpus_hash.txt /bin/ls | grep -q "matches"

      - name: Smoke-test TLSH corpus matching
        run: |
          set -euxo pipefail
          sudo apt-get install -y tlsh-tools
          # TLSH's totalDiff() is a DISTANCE (opposite direction from
          # ssdeep's similarity score above) - lower means MORE
          # similar, 0 = identical. Reuses /tmp/ptrace_test and
          # /tmp/ptrace_test_variant from the ssdeep step just above -
          # same fixture, same "few trailing bytes appended" variant,
          # proving the same near-identical-variant case against a
          # second, independent fuzzy-hash algorithm (see
          # check_tlsh_corpus()'s comment in avd.c on why running both
          # is real defense in depth, not a duplicate check).
          diff_variant="$(tlsh -c /tmp/ptrace_test -f /tmp/ptrace_test_variant | awk '{print $1}')"
          echo "variant diff: $diff_variant (expect well under TLSH_MATCH_MAX_DIFF=30)"
          [ "$diff_variant" -le 30 ]
          # an unrelated file should score a HIGH distance
          diff_unrelated="$(tlsh -c /tmp/ptrace_test -f /bin/ls | awk '{print $1}')"
          echo "unrelated diff: $diff_unrelated (expect well over 30)"
          [ "$diff_unrelated" -gt 30 ]

      - name: Smoke-test the actual TLSH shim and corpus format
        run: |
          set -euxo pipefail
          # The step above only exercises the standalone `tlsh` CLI -
          # it never calls av_tlsh_hash_fd()/av_tlsh_diff() (the real
          # shim avd.c actually links against) or parses
          # corpus/tlsh_hashes.txt, so it could stay green even if the
          # C/C++ shim boundary or the corpus file format were broken.
          # This closes that gap without the much heavier lift of a
          # full kernel+netlink+daemon round trip (avd.c's own header
          # comment already documents that as a separate, pre-existing,
          # not-yet-covered gap for the whole daemon, not something
          # specific to TLSH) - it links against the real
          # tlsh_shim.o built by the "Build avd" step above, and reads
          # the real corpus/tlsh_hashes.txt with load_tlsh_corpus()'s
          # exact line format (hash,name - avd.c's own loader is
          # static/not exported, so this reimplements just enough of
          # its parsing to exercise the same file, not a mock of it).
          cat > /tmp/tlsh_shim_smoke.cpp << 'EOF'
          #include "tlsh_shim.h"
          #include <cstdio>
          #include <cstring>
          #include <fcntl.h>
          #include <unistd.h>

          int main(void) {
            int fd1 = open("/tmp/ptrace_test", O_RDONLY);
            int fd2 = open("/tmp/ptrace_test_variant", O_RDONLY);
            if (fd1 < 0 || fd2 < 0) { perror("open"); return 1; }

            char h1[256], h2[256];
            if (av_tlsh_hash_fd(fd1, h1, sizeof(h1)) != 0) {
              fprintf(stderr, "FAIL: av_tlsh_hash_fd(original) failed\n");
              return 1;
            }
            if (av_tlsh_hash_fd(fd2, h2, sizeof(h2)) != 0) {
              fprintf(stderr, "FAIL: av_tlsh_hash_fd(variant) failed\n");
              return 1;
            }
            close(fd1);
            close(fd2);

            int diff = av_tlsh_diff(h1, h2);
            printf("shim diff(original, variant) = %d\n", diff);
            if (diff < 0 || diff > 30) {
              fprintf(stderr, "FAIL: shim diff out of expected range\n");
              return 1;
            }

            FILE *fp = fopen("corpus/tlsh_hashes.txt", "r");
            if (!fp) { perror("fopen corpus"); return 1; }
            char line[512];
            int found = 0;
            while (fgets(line, sizeof(line), fp)) {
              char *newline = strchr(line, '\n');
              if (newline) *newline = '\0';
              if (line[0] == '#' || line[0] == '\0') continue;
              char *comma = strchr(line, ',');
              if (!comma) continue;
              *comma = '\0';
              int self_diff = av_tlsh_diff(line, line);
              if (self_diff != 0) {
                fprintf(stderr, "FAIL: corpus hash doesn't self-compare to 0 (got %d)\n", self_diff);
                return 1;
              }
              found = 1;
            }
            fclose(fp);
            if (!found) {
              fprintf(stderr, "FAIL: no usable corpus entries found\n");
              return 1;
            }

            printf("OK: shim + corpus format both verified\n");
            return 0;
          }
          EOF
          g++ -Wall -Wextra -O2 -Iuserspace/avd -I/usr/include/tlsh \
              -c /tmp/tlsh_shim_smoke.cpp -o /tmp/tlsh_shim_smoke.o
          g++ -o /tmp/tlsh_shim_smoke /tmp/tlsh_shim_smoke.o \
              userspace/avd/tlsh_shim.o -ltlsh
          /tmp/tlsh_shim_smoke

      - uses: actions/upload-artifact@v7
        with:
          name: avd
          path: userspace/avd/avd
          if-no-files-found: error
