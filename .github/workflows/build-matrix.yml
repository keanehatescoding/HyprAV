name: Build matrix (compile compatibility)

# Tier 1 CI: verifies every module still COMPILES against multiple kernel
# versions. This does not insmod/boot anything - GitHub-hosted runners
# can't switch their host kernel, and free-tier runners have unreliable
# /dev/kvm access, so this is compile-only compatibility testing.
# Runtime testing (insmod + trigger detection) belongs in a separate
# QEMU-based job - see README.md "CI" section for why that's kept apart.

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Update these as kernel.org publishes new point releases.
        # Format must match the tarball name exactly, e.g. 6.12.96.
        kernel_version:
          - "6.12.96"  # LTS
          - "6.18.21"  # LTS
          - "7.1.4"    # current stable
        # A module generally must be built with the same compiler family
        # as the target kernel, especially under LTO/CFI configs - e.g.
        # CachyOS ships a Clang-built kernel variant. Rather than branch
        # the repo per toolchain, we build BOTH the kernel and the module
        # with the same compiler on each leg of this matrix.
        toolchain: [gcc, clang]
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies (gcc)
        if: matrix.toolchain == 'gcc'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev

      - name: Install build dependencies (clang)
        if: matrix.toolchain == 'clang'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm bc bison flex libssl-dev libelf-dev

      - name: Cache built kernel tree
        id: cache-kernel
        uses: actions/cache@v4
        with:
          path: linux-${{ matrix.kernel_version }}-${{ matrix.toolchain }}
          key: kernel-tree-v5-${{ matrix.kernel_version }}-${{ matrix.toolchain }}

      - name: Download and build a minimal kernel
        if: steps.cache-kernel.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          MAJOR="$(echo "${{ matrix.kernel_version }}" | cut -d. -f1)"
          SRCDIR="linux-${{ matrix.kernel_version }}-${{ matrix.toolchain }}"
          curl -fL -o linux.tar.xz \
            "https://cdn.kernel.org/pub/linux/kernel/v${MAJOR}.x/linux-${{ matrix.kernel_version }}.tar.xz"
          mkdir -p "$SRCDIR"
          tar -xf linux.tar.xz -C "$SRCDIR" --strip-components=1
          rm linux.tar.xz
          cd "$SRCDIR"
          LLVM_ARG=""
          if [ "${{ matrix.toolchain }}" = "clang" ]; then LLVM_ARG="LLVM=1"; fi
          # modules_prepare alone does NOT produce a real Module.symvers -
          # that file is only populated by actually compiling the kernel
          # source that contains EXPORT_SYMBOL() calls. A full defconfig
          # build works but takes 30-60+ minutes; tinyconfig + just the
          # subsystems our modules touch gets a real, complete symbol
          # table in a few minutes instead.
          make $LLVM_ARG tinyconfig
          ./scripts/config --enable CONFIG_MODULES
          ./scripts/config --enable CONFIG_KPROBES
          ./scripts/config --enable CONFIG_CRYPTO
          ./scripts/config --enable CONFIG_CRYPTO_HASH
          ./scripts/config --enable CONFIG_CRYPTO_MD5
          ./scripts/config --enable CONFIG_CRYPTO_SHA1
          ./scripts/config --enable CONFIG_CRYPTO_SHA256
          ./scripts/config --enable CONFIG_PROC_FS
          ./scripts/config --enable CONFIG_NET
          make $LLVM_ARG olddefconfig
          make $LLVM_ARG -j"$(nproc)"

      - name: Build av/ against this kernel tree
        run: |
          set -euxo pipefail
          KDIR="$GITHUB_WORKSPACE/linux-${{ matrix.kernel_version }}-${{ matrix.toolchain }}"
          if [ "${{ matrix.toolchain }}" = "clang" ]; then
            make -C av KDIR="$KDIR" CC=clang LLVM=1 clean
            make -C av KDIR="$KDIR" CC=clang LLVM=1
          else
            make -C av KDIR="$KDIR" clean
            make -C av KDIR="$KDIR"
          fi

      - name: Build experiments/ against this kernel tree
        run: |
          set -euxo pipefail
          KDIR="$GITHUB_WORKSPACE/linux-${{ matrix.kernel_version }}-${{ matrix.toolchain }}"
          EXTRA_ARGS=""
          if [ "${{ matrix.toolchain }}" = "clang" ]; then EXTRA_ARGS="CC=clang LLVM=1"; fi
          for d in experiments/hello experiments/procfs_demo experiments/kprobe_log; do
            echo "::group::Building $d"
            make -C "$d" KDIR="$KDIR" $EXTRA_ARGS clean
            make -C "$d" KDIR="$KDIR" $EXTRA_ARGS
            echo "::endgroup::"
          done

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modules-${{ matrix.kernel_version }}-${{ matrix.toolchain }}
          path: |
            av/*.ko
            experiments/*/*.ko
          if-no-files-found: warn

  build-avctl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build avctl
        run: make -C userspace/avctl
      - uses: actions/upload-artifact@v4
        with:
          name: avctl
          path: userspace/avctl/avctl
          if-no-files-found: error

  build-avd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install libnl-genl, libyara, and libfuzzy
        run: |
          sudo apt-get update
          sudo apt-get install -y libnl-genl-3-dev libyara-dev libfuzzy-dev pkg-config
      - name: Build avd
        run: make -C userspace/avd

      - name: Smoke-test YARA rules against EICAR
        run: |
          set -euxo pipefail
          sudo apt-get install -y yara
          printf 'X5O!P%%@AP[4\PZX54(P^)7CC)7}$EICAR-STANDARD-ANTIVIRUS-TEST-FILE!$H+H*' > /tmp/eicar.com
          yara rules/test.yar /tmp/eicar.com | grep -q EICAR_Test_String

      - name: Smoke-test heuristics.yar against a real ptrace-importing binary
        run: |
          set -euxo pipefail
          cat > /tmp/ptrace_test.c << 'EOF'
          #include <sys/ptrace.h>
          #include <stddef.h>
          int main(void) { ptrace(PTRACE_ATTACH, 1234, NULL, NULL); return 0; }
          EOF
          gcc -o /tmp/ptrace_test /tmp/ptrace_test.c
          yara rules/heuristics.yar /tmp/ptrace_test | grep -q Imports_Ptrace
          # a genuinely clean binary should NOT match
          ! yara rules/heuristics.yar /bin/ls | grep -q Imports_Ptrace

      - name: Smoke-test elf_analysis.yar against a real UPX-packed binary
        run: |
          set -euxo pipefail
          sudo apt-get install -y upx-ucl
          upx --best -o /tmp/upx_packed /tmp/ptrace_test
          yara rules/elf_analysis.yar /tmp/upx_packed | grep -q No_Section_Headers
          ! yara rules/elf_analysis.yar /bin/ls | grep -q No_Section_Headers

      - name: Smoke-test entropy.yar against real calibration samples
        run: |
          set -euxo pipefail
          head -c 100000 /dev/urandom > /tmp/random_sample.bin
          yara rules/entropy.yar /tmp/upx_packed | grep -q High_Overall_Entropy
          yara rules/entropy.yar /tmp/random_sample.bin | grep -q High_Overall_Entropy
          ! yara rules/entropy.yar /bin/ls | grep -q High_Overall_Entropy
          # per-section check: inject a real high-entropy section and confirm it fires
          cp /tmp/ptrace_test /tmp/section_entropy_test
          objcopy --add-section .packed_data=/tmp/random_sample.bin \
                  --set-section-flags .packed_data=alloc,contents \
                  /tmp/section_entropy_test
          yara rules/entropy.yar /tmp/section_entropy_test | grep -q High_Entropy_Section

      - name: Smoke-test fuzzy hash corpus matching
        run: |
          set -euxo pipefail
          sudo apt-get install -y ssdeep
          # a minor variant (a few bytes appended) should score high
          # similarity against the corpus-seed original - this is the
          # whole point of fuzzy hashing vs exact hash matching
          cp /tmp/ptrace_test /tmp/ptrace_test_variant
          echo "extra padding for testing" >> /tmp/ptrace_test_variant
          ssdeep -b /tmp/ptrace_test > /tmp/corpus_hash.txt
          ssdeep -m /tmp/corpus_hash.txt /tmp/ptrace_test_variant | grep -q "matches"
          # an unrelated file should NOT match
          ! ssdeep -m /tmp/corpus_hash.txt /bin/ls | grep -q "matches"

      - uses: actions/upload-artifact@v4
        with:
          name: avd
          path: userspace/avd/avd
          if-no-files-found: error
